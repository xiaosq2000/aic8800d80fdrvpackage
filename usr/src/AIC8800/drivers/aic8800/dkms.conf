PACKAGE_NAME="aic8800"
PACKAGE_VERSION="6.4.3.0"

# The vendor Makefile resolves KDIR and KVER from `uname -r`, i.e. the running
# kernel. DKMS builds for kernels that are not running (that is the whole
# point), so both have to be overridden here or every kernel upgrade would
# compile against the headers of the kernel you happen to be booted into.
MAKE[0]="make KDIR=${kernel_source_dir} KVER=${kernelver} modules"
CLEAN="make clean"

# aic8800_fdrv links against symbols exported by aic_load_fw, so aic_load_fw
# has to be built and installed first.
BUILT_MODULE_NAME[0]="aic_load_fw"
BUILT_MODULE_LOCATION[0]="aic_load_fw"
DEST_MODULE_LOCATION[0]="/kernel/drivers/net/wireless/aic8800"

BUILT_MODULE_NAME[1]="aic8800_fdrv"
BUILT_MODULE_LOCATION[1]="aic8800_fdrv"
DEST_MODULE_LOCATION[1]="/kernel/drivers/net/wireless/aic8800"

AUTOINSTALL="yes"
